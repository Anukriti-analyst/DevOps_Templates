name: UI React Vite Build

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22.x'
      vite-api-base-url:
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: ${{ inputs.node-version }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_API_BASE_URL: ${{ inputs.vite-api-base-url != '' && inputs.vite-api-base-url || vars.VITE_UAT_API_BASE_URL || vars.VITE_PROD_API_BASE_URL || vars.VITE_DEV_API_BASE_URL || vars.VITE_QA_API_BASE_URL || vars.VITE_API_BASE_URL || 'https://enablr-gch2agdgfme6fedr.centralus-01.azurewebsites.net' }}
        run: npm run build

      - name: Prepare build artifacts
        run: |
          mkdir -p build-artifacts
          cp -R dist build-artifacts/dist
          cp package.json package-lock.json build-artifacts/
          printf 'commit=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > build-artifacts/build-metadata.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-build-artifacts
          path: build-artifacts
          if-no-files-found: error
          retention-days: 7
