name: Shared SonarQube Analysis

on:
  workflow_call:
    inputs:
      project-key:
        required: true
        type: string
      sources:
        required: true
        type: string
      exclusions:
        required: false
        type: string
        default: ''
      node-version:
        required: false
        type: string
        default: '22.x'

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Run SonarQube scan
        if: vars.SONAR_HOST_URL != '' && secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >-
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.exclusions=${{ inputs.exclusions }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube configuration missing
        if: vars.SONAR_HOST_URL == '' || secrets.SONAR_TOKEN == ''
        run: echo "::warning::SonarQube scan skipped because configuration is missing."

      - name: Upload SonarQube artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: .scannerwork/**
          if-no-files-found: ignore
          retention-days: 7
