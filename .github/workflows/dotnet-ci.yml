name: .NET API Build

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.x'
      solution-path:
        required: false
        type: string
        default: PolicyIntake.API/PolicyIntake.API.sln
      project-path:
        required: false
        type: string
        default: PolicyIntake.API/PolicyIntake.API.csproj
      artifact-name:
        required: false
        type: string
        default: api-build-artifacts

permissions:
  contents: read

env:
  DOTNET_VERSION: ${{ inputs.dotnet-version }}
  SOLUTION_PATH: ${{ inputs.solution-path }}
  PROJECT_PATH: ${{ inputs.project-path }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-restore --output build-artifacts

      - name: Write build metadata
        shell: bash
        run: |
          printf 'commit=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > build-artifacts/build-metadata.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build-artifacts
          if-no-files-found: error
          retention-days: 7
