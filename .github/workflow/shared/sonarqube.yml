name: Shared SonarQube Analysis
on:
  workflow_call:
    inputs:
      project-key: { required: true, type: string }
      sources: { required: true, type: string }
      exclusions: { required: false, type: string, default: '' }
permissions:
  contents: read
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run SonarQube scan
        if: vars.SONAR_HOST_URL != '' && secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >-
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.exclusions=${{ inputs.exclusions }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Report missing SonarQube configuration
        if: vars.SONAR_HOST_URL == '' || secrets.SONAR_TOKEN == ''
        run: echo "::warning::SonarQube scan skipped because configuration is missing."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-results-${{ github.sha }}
          path: .scannerwork/**
          if-no-files-found: ignore
          retention-days: 7