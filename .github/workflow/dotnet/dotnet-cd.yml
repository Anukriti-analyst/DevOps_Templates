name: .NET ASP.NET Core Azure CD
on:
  workflow_call:
    inputs:
      environment: { required: false, type: string, default: dev }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: fmessentials-api-${{ github.sha }}, path: publish }
      - uses: azure/webapps-deploy@v3
        with: { app-name: ${{ vars.AZURE_WEBAPP_NAME }}, slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}, publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}, package: publish }