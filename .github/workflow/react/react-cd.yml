name: UI React Vite Azure CD
on: { workflow_call: }
permissions: { contents: read }
jobs:
  deploy-dev:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'develop' && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest
    environment: dev
    steps: &deploy_steps
      - uses: actions/download-artifact@v4
        with: { name: ui-dist-${{ github.sha }}, path: release }
      - uses: azure/webapps-deploy@v3
        with: { app-name: ${{ vars.AZURE_WEBAPP_NAME }}, slot-name: ${{ vars.AZURE_WEBAPP_SLOT_NAME }}, publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}, package: release }
  deploy-qa:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    environment: qa
    steps: *deploy_steps
  deploy-uat:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    environment: uat
    steps: *deploy_steps
  deploy-prod:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'main'
    runs-on: ubuntu-latest
    environment: prod
    steps: *deploy_steps